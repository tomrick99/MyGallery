spring:
  application:
    name: mygallery
  profiles:
    default: memory

mygallery:
  auth:
    admin:
      username: test-owner
      password-bcrypt-hash: '$2a$04$vvfatPN0PdqIWH8vfIprVOriHke81ApVotyhpAzHvfLMU4LM1ntz2'
    cors:
      allowed-origins: http://localhost:3000

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: mygallery-test-session
        secure: false
        http-only: true
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
