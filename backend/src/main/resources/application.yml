spring:
  application:
    name: mygallery
  profiles:
    default: memory

mygallery:
  auth:
    admin:
      username: ${ADMIN_USERNAME:}
      password-bcrypt-hash: ${ADMIN_PASSWORD_BCRYPT_HASH:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    session:
      absolute-timeout: ${ADMIN_SESSION_ABSOLUTE_TIMEOUT:8h}
  cloudinary:
    upload:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      upload-preset: ${CLOUDINARY_UPLOAD_PRESET:}
      public-id-prefix: ${CLOUDINARY_UPLOAD_PUBLIC_ID_PREFIX:mygallery/originals}
      max-bytes: ${CLOUDINARY_UPLOAD_MAX_BYTES:52428800}
      signature-ttl-seconds: ${CLOUDINARY_UPLOAD_SIGNATURE_TTL_SECONDS:120}
      allowed-formats: ${CLOUDINARY_UPLOAD_ALLOWED_FORMATS:jpg,jpeg,png,webp,heic,heif}

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: ${SESSION_COOKIE_NAME:mygallery-session}
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
