spring:
  datasource:
    url: ${MYGALLERY_DB_URL}
    username: ${MYGALLERY_DB_USERNAME}
    password: ${MYGALLERY_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${MYGALLERY_DB_POOL_MAX_SIZE:5}
      minimum-idle: ${MYGALLERY_DB_POOL_MIN_IDLE:0}
      connection-timeout: ${MYGALLERY_DB_CONNECTION_TIMEOUT:10s}
      validation-timeout: ${MYGALLERY_DB_VALIDATION_TIMEOUT:5s}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
